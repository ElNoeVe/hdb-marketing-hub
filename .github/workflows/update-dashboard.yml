name: Actualizar Dashboard (Facebook Data)

on:
  schedule:
    # Ejecutar cada 12 horas: a las 7:00 AM y 7:00 PM CST (13:00 y 01:00 UTC)
    - cron: '0 13,1 * * *'
  workflow_dispatch: # Permite ejecución manual desde GitHub

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      # No dependencies needed as fetch is native in Node 20
      
      - name: Ejecutar fetch-facebook.js
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_AD_ACCOUNT_ID: ${{ secrets.FB_AD_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/fetch-facebook.js
        # Runs from root so process.cwd() is correct for data/reportes path
      
      - name: Commit & Push Reporte
        run: |
          git config user.name "HDB Bot"
          git config user.email "bot@hdb-marketing.local"
          git add data/reportes/
          # Commit only if there are changes
          git diff --staged --quiet || git commit -m "📊 Datos Facebook actualizados $(date +%Y-%m-%d)"
          git push
