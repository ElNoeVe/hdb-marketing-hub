name: Análisis de Campañas

on:
  schedule:
    # L/Mi/V a las 7:00 AM CST (13:00 UTC)
    - cron: '0 13 * * 1,3,5'
  workflow_dispatch: # Permite ejecución manual

permissions:
  contents: write

jobs:
  analizar:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Instalar dependencias
        run: npm install
        working-directory: scripts
      
      - name: Ejecutar análisis
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_AD_ACCOUNT_ID: ${{ secrets.FB_AD_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node fetch-facebook.js
        working-directory: scripts
      
      - name: Guardar reporte
        run: |
          git config user.name "HDB Bot"
          git config user.email "bot@hdb-marketing.local"
          git add data/reportes/
          git commit -m "📊 Reporte automático $(date +%Y-%m-%d)" || echo "Sin cambios"
          git push
